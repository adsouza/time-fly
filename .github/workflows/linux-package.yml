# Linux x86-64 test packages: a .deb and a single-file Flatpak bundle from one release build.
# Manual (workflow_dispatch) or on v* tags only, to save CI minutes. No secrets.
name: linux-package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # GitHub only dispatches workflows it knows from the default branch, or that have run once.
    # Until this file is on main, a push to milestone-1 that changes it registers it (and runs it).
    branches: [milestone-1]
    paths: [.github/workflows/linux-package.yml]

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so `cmd | tee log` fails when cmd does

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # 22.04 for its older glibc, so the binary runs on more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            desktop-file-utils appstream dpkg-dev
          mkdir -p ci-logs

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.adsouza.TimeFly.desktop
          appstreamcli validate --no-net packaging/linux/io.github.adsouza.TimeFly.metainfo.xml

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # setup-uv publishes no major-version tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Version
        id: meta
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "timefly") | .version')
          echo "short_sha=$short_sha" >>"$GITHUB_OUTPUT"
          echo "version=${cargo_version}~git${short_sha}" >>"$GITHUB_OUTPUT"
          echo "version ${cargo_version}~git${short_sha}"

      - name: Bake tool tests
        working-directory: tools/bake
        run: uv run --locked pytest -q 2>&1 | tee ../../ci-logs/pytest.txt

      - name: Core tests
        run: cargo test --locked -p timefly_core 2>&1 | tee ci-logs/cargo-test-timefly_core.txt

      - name: Release build
        env:
          TIMEFLY_GIT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: cargo build --locked --release -p timefly 2>&1 | tee ci-logs/cargo-build.txt

      - name: Cache raw data
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('data/sources.json') }}

      - name: Fetch raw data (pinned, verified)
        working-directory: tools/bake
        run: |
          uv run --locked timefly-fetch --sources ../../data/sources.json --raw ../../data/raw \
            2>&1 | tee ../../ci-logs/fetch.txt

      - name: Bake globe data
        working-directory: tools/bake
        run: |
          uv run --locked timefly-bake --raw ../../data/raw \
            --out ../../crates/timefly/assets/data/globe 2>&1 | tee ../../ci-logs/bake.txt

      - name: Stage install tree
        run: |
          packaging/linux/stage.sh target/release/timefly crates/timefly/assets staged
          find staged -path '*/frames/f0*' -prune -o -print | sort
          test ! -e staged/lib/time-fly/assets/data/globe/bake.log

      - name: Validate staged desktop entry and AppStream metadata
        run: |
          desktop-file-validate staged/share/applications/io.github.adsouza.TimeFly.desktop
          appstreamcli validate --no-net staged/share/metainfo/io.github.adsouza.TimeFly.metainfo.xml

      - name: Build .deb
        run: |
          packaging/linux/build-deb.sh staged "${{ steps.meta.outputs.version }}" dist
          # Tarred so the Flatpak job keeps file modes (artifacts do not).
          tar -C staged -czf dist/staged.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: time-fly_${{ steps.meta.outputs.version }}_amd64.deb
          path: dist/time-fly_${{ steps.meta.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: staged-tree
          path: dist/staged.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload bake log and test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            ci-logs/
            crates/timefly/assets/data/globe/bake.log
          if-no-files-found: warn
          retention-days: 14

  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The image matches the manifest's runtime branch (org.freedesktop.Platform 26.08).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      BUNDLE: time-fly-${{ needs.build.outputs.short_sha }}.flatpak
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: staged-tree
          path: dist

      - name: Unpack staged tree
        run: |
          mkdir -p packaging/flatpak/staged
          tar -C packaging/flatpak/staged -xzf dist/staged.tar.gz
          ls -l packaging/flatpak/staged/bin packaging/flatpak/staged/lib/time-fly

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.adsouza.TimeFly.yml
          bundle: ${{ env.BUNDLE }}
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          cache: false
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 14
