# Linux x86-64 test packages: a .deb and a single-file Flatpak bundle from one release build.
# Manual (workflow_dispatch) or on v* tags only, to save CI minutes. No secrets.
#
# Jobs: `test` (dev-profile gates) runs in parallel with `build` (release binary, data, .deb);
# `flatpak` needs both. Caches: Rust targets per job (rust-cache, saved on failure too), uv
# downloads, the raw data (keyed on data/sources.json), the baked globe and the baked region
# tiles (each keyed on its inputs; when both hit, nothing is fetched or baked).
name: linux-package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so `cmd | tee log` fails when cmd does

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The game crate's tests build Bevy, which links these.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # setup-uv publishes no major-version tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/bake/uv.lock

      - name: Bake tool tests
        working-directory: tools/bake
        run: |
          mkdir -p ../../ci-logs
          uv run --locked pytest -q 2>&1 | tee ../../ci-logs/pytest.txt

      # Both test steps use the `ci-test` profile (Cargo.toml): dependencies unoptimized, so
      # Bevy compiles far faster than at the dev profile's opt-level 3. The two steps share it.
      - name: Core tests
        run: cargo test --locked --profile ci-test -p timefly_core 2>&1 | tee ci-logs/cargo-test-timefly_core.txt

      # CPU-only: the data loader on the tiny bake, the crash flow, `--check-data`. The GPU
      # globe test is #[ignore].
      - name: Game crate tests
        run: cargo test --locked --profile ci-test -p timefly 2>&1 | tee ci-logs/cargo-test-timefly.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  build:
    # 22.04 for its older glibc, so the binary runs on more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    env:
      # Line tables stay in the binary for panic backtraces (release profile unchanged). CI
      # alone compresses the debug sections with zlib, which keeps the packages small (owner
      # decision 2026-11-22: about 123 MB download / 230 MB installed, against 80 / 576 MB
      # uncompressed); local builds are unaffected. Linking uses rustc's default on this target
      # since Rust 1.90, the bundled rust-lld (mold-class speed).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            desktop-file-utils appstream dpkg-dev
          mkdir -p ci-logs

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      # Keyed on Cargo.lock, the toolchain file and RUST*/CARGO* env; TIMEFLY_GIT_SHA is not
      # part of the key and only reruns the timefly build script.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Version
        id: meta
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "timefly") | .version')
          echo "short_sha=$short_sha" >>"$GITHUB_OUTPUT"
          echo "version=${cargo_version}~git${short_sha}" >>"$GITHUB_OUTPUT"
          echo "version ${cargo_version}~git${short_sha}"

      # Before anything writes into tools/bake, so the key hashes sources only.
      - name: Cache baked globe
        id: bake-cache
        uses: actions/cache@v6
        with:
          path: crates/timefly/assets/data/globe
          key: baked-globe-${{ hashFiles('data/sources.json', 'data/paleodem_ages.csv', 'tools/bake/**') }}

      # The region tiles (ETOPO 2022 + Koppen-Geiger, about 256 MB); same rule as the globe.
      - name: Cache baked tiles
        id: tiles-cache
        uses: actions/cache@v6
        with:
          path: crates/timefly/assets/data/tiles
          key: baked-tiles-${{ hashFiles('data/sources.json', 'tools/bake/**') }}

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.bake-cache.outputs.cache-hit != 'true' || steps.tiles-cache.outputs.cache-hit != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: tools/bake/uv.lock

      - name: Release build
        env:
          TIMEFLY_GIT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          cargo build --locked --release -p timefly 2>&1 | tee ci-logs/cargo-build.txt
          ls -l target/release/timefly
          readelf -p .comment target/release/timefly | grep -iE 'lld|mold|GNU ld' || true
          readelf -SW target/release/timefly | grep -E ' \.(text|rodata|debug_[a-z]+) ' || true

      - name: Smoke test the binary (headless probes, backtrace has file:line)
        run: |
          logs="$RUNNER_TEMP/probe-logs"
          TIMEFLY_LOG_DIR="$logs" target/release/timefly --diagnostics-probe=clean
          if TIMEFLY_LOG_DIR="$logs" target/release/timefly --diagnostics-probe=panic; then
            echo "panic probe exited 0"; exit 1
          fi
          crash=$(find "$logs" -name crash.txt | head -1)
          test -n "$crash"
          grep -E 'diagnostics/probe\.rs:[0-9]+' "$crash"

      - name: Cache raw data
        if: steps.bake-cache.outputs.cache-hit != 'true' || steps.tiles-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('data/sources.json') }}

      - name: Fetch raw data (pinned, verified)
        if: steps.bake-cache.outputs.cache-hit != 'true' || steps.tiles-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: |
          uv run --locked timefly-fetch --sources ../../data/sources.json --raw ../../data/raw \
            2>&1 | tee ../../ci-logs/fetch.txt

      - name: Bake globe data
        if: steps.bake-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: |
          uv run --locked timefly-bake --raw ../../data/raw \
            --out ../../crates/timefly/assets/data/globe 2>&1 | tee ../../ci-logs/bake.txt

      - name: Bake region tiles
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: |
          uv run --locked timefly-bake tiles --raw ../../data/raw \
            --out ../../crates/timefly/assets/data/tiles 2>&1 | tee ../../ci-logs/bake-tiles.txt

      # Whether baked here or restored from the cache, the bakes must load in this build's
      # readers (window-less, no GPU): the globe, then the tiles beside it (the manifest, the
      # overview and the three largest tiles, size- and SHA-256-checked). Exits 1 with the
      # loader's error otherwise.
      - name: Load the bake with the game's reader
        run: |
          TIMEFLY_LOG_DIR="$RUNNER_TEMP/check-data-logs" target/release/timefly \
            --check-data=crates/timefly/assets/data/globe 2>&1 | tee ci-logs/check-data.txt

      - name: Stage install tree
        run: |
          echo "baked globe from cache: ${{ steps.bake-cache.outputs.cache-hit == 'true' }}"
          echo "baked tiles from cache: ${{ steps.tiles-cache.outputs.cache-hit == 'true' }}"
          packaging/linux/stage.sh target/release/timefly crates/timefly/assets staged
          find staged -path '*/frames/f0*' -prune -o -path '*/tiles/r*' -prune -o -print | sort
          test ! -e staged/lib/time-fly/assets/data/globe/bake.log
          test ! -e staged/lib/time-fly/assets/data/tiles/bake.log
          du -sh staged staged/lib/time-fly/assets/data/*

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate staged/share/applications/io.github.adsouza.TimeFly.desktop
          appstreamcli validate --no-net staged/share/metainfo/io.github.adsouza.TimeFly.metainfo.xml

      - name: Build .deb
        run: |
          packaging/linux/build-deb.sh staged "${{ steps.meta.outputs.version }}" dist
          # Tarred so the Flatpak job keeps file modes (artifacts do not).
          tar -C staged -czf dist/staged.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: time-fly_${{ steps.meta.outputs.version }}_amd64.deb
          path: dist/time-fly_${{ steps.meta.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # already xz

      - uses: actions/upload-artifact@v7
        with:
          name: staged-tree
          path: dist/staged.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload bake log and build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            ci-logs/
            crates/timefly/assets/data/globe/bake.log
            crates/timefly/assets/data/tiles/bake.log
          if-no-files-found: warn
          retention-days: 14

  flatpak:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The image matches the manifest's runtime branch and ships org.freedesktop.Platform and
    # Sdk 26.08, so flatpak-builder runs without --install-deps-from (no runtime download or
    # update; the bundle names the runtime and installing it pulls the current 26.08 from
    # Flathub). Nothing is compiled, so flatpak-builder's state cache would not help.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      BUNDLE: time-fly-${{ needs.build.outputs.short_sha }}.flatpak
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: staged-tree
          path: dist

      - name: Unpack staged tree
        run: |
          mkdir -p packaging/flatpak/staged
          tar -C packaging/flatpak/staged -xzf dist/staged.tar.gz
          ls -l packaging/flatpak/staged/bin packaging/flatpak/staged/lib/time-fly

      - name: Build Flatpak bundle
        run: |
          flatpak info org.freedesktop.Sdk//26.08 | head -5
          flatpak-builder --repo=repo --disable-rofiles-fuse --force-clean \
            --default-branch=master --arch=x86_64 \
            --subject="Built from ${GITHUB_SHA}" \
            build-dir packaging/flatpak/io.github.adsouza.TimeFly.yml
          flatpak build-bundle repo "$BUNDLE" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 io.github.adsouza.TimeFly master
          ls -l "$BUNDLE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # already compressed
