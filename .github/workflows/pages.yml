name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'packaging/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same caches (keys and paths) as linux-package.yml, so the two workflows share them.
      # Before anything writes into tools/bake, so the keys hash sources only. When both bakes
      # hit, nothing is fetched or baked.
      - name: Cache baked globe
        id: bake-cache
        uses: actions/cache@v6
        with:
          path: crates/timefly/assets/data/globe
          key: baked-globe-${{ hashFiles('data/sources.json', 'data/paleodem_ages.csv', 'tools/bake/**') }}

      - name: Cache baked tiles
        id: tiles-cache
        uses: actions/cache@v6
        with:
          path: crates/timefly/assets/data/tiles
          key: baked-tiles-${{ hashFiles('data/sources.json', 'tools/bake/**') }}

      - name: Cache raw data
        if: steps.bake-cache.outputs.cache-hit != 'true' || steps.tiles-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('data/sources.json') }}

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/bake/uv.lock

      - name: Build the WebGPU app
        run: cargo build --locked --profile web-release --target wasm32-unknown-unknown -p timefly

      - name: Generate browser bindings
        run: |
          version=$(cargo tree --locked --target wasm32-unknown-unknown -p wasm-bindgen --depth 0 --prefix none | awk '{print substr($2, 2)}')
          cli="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${cli}.tar.gz"
          cd "$RUNNER_TEMP"
          mkdir -p gh-release
          curl -fsSL "$url" -o "gh-release/$cli.tar.gz"
          curl -fsSL "$url.sha256sum" | sha256sum -c -
          tar -xzf "gh-release/$cli.tar.gz"
          "$cli/wasm-bindgen" --target web --no-typescript --out-dir "$GITHUB_WORKSPACE/_site" \
            "$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/web-release/timefly.wasm"

      - name: Fetch raw data (pinned, verified)
        if: steps.bake-cache.outputs.cache-hit != 'true' || steps.tiles-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: uv run --locked timefly-fetch --sources ../../data/sources.json --raw ../../data/raw

      - name: Bake globe data
        if: steps.bake-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: uv run --locked timefly-bake --raw ../../data/raw --out ../../crates/timefly/assets/data/globe

      - name: Bake region tiles
        if: steps.tiles-cache.outputs.cache-hit != 'true'
        working-directory: tools/bake
        run: uv run --locked timefly-bake tiles --raw ../../data/raw --out ../../crates/timefly/assets/data/tiles

      # The client fetches the tile manifest, the overview and only the tiles a region needs.
      - name: Assemble the site with the production globe and tiles
        run: |
          cp packaging/web/index.html _site/
          cp packaging/linux/io.github.adsouza.TimeFly.svg _site/favicon.svg
          cp -R crates/timefly/assets _site/
          rm -f _site/assets/data/globe/bake.log _site/assets/data/tiles/bake.log
          test -f _site/assets/data/globe/manifest.json
          test -f _site/assets/data/tiles/manifest.json
          test -f _site/assets/data/tiles/overview.tfgrid

      # GitHub Pages: at most 1 GB per site and 100 MB per file.
      - name: Check the site against the Pages limits
        run: |
          du -sh _site _site/*.wasm _site/assets/data/*
          big=$(find _site -type f -size +100M)
          if [ -n "$big" ]; then echo "files over 100 MB: $big"; exit 1; fi
          total=$(du -sk _site | cut -f1)
          echo "site total ${total} KiB"
          if [ "$total" -gt 976562 ]; then echo "site over 1 GB"; exit 1; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
