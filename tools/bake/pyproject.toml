[project]
name = "timefly-bake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "netCDF4",
    "zstandard",
    "pygplates>=1.0",
    "cryptography>=50.0.2",
    "tifffile>=2026.11.16",
    "imagecodecs>=2026.11.11",
]

[project.scripts]
timefly-bake = "timefly_bake.cli:main"
timefly-fetch = "timefly_bake.fetch:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timefly_bake"]
