[project]
name = "timefly-bake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "netCDF4", "zstandard", "pygplates>=1.0"]

[project.scripts]
timefly-bake = "timefly_bake.cli:main"
timefly-fetch = "timefly_bake.fetch:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timefly_bake"]
