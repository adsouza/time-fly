[package]
name = "timefly_core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_math = "0.20"
ruzstd = "0.9"
half = "2"
# For `#[instrument]` on coarse entry points only (spec §20); no log statements in bodies.
tracing = "0.1"
# Parses the compiled-in lake level table (`data/hydrology/lake_levels.json`).
serde_json = "1"

[dev-dependencies]
proptest = "1.12"
