[package]
name = "timefly"
version = "0.1.0"
edition = "2024"

[features]
default = ["system-spans"]
# Bevy's `trace` feature wraps every system and schedule in a span (spec §20); `debug` gives the
# spans their system names. Task 10 measures the cost.
system-spans = ["bevy/trace", "bevy/debug"]

[dependencies]
bevy = { version = "0.20", features = ["ktx2", "zstd_rust", "bevy_ui_widgets"] }
timefly_core = { path = "../timefly_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1.19", features = ["derive"] }
tracing = "0.1"

# basis-universal builds a C++ transcoder that needs a libc sysroot, which wasm32-unknown-unknown
# does not have, so it is enabled on native targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", features = ["basis-universal"] }
# The appender's non-blocking writer runs a worker thread, which wasm32 does not have; the web
# keeps its log in localStorage instead.
tracing-appender = "0.2"
directories = "6"
fd-lock = "4"
opener = { version = "0.9", features = ["reveal"] }
rfd = "0.18"
# The pre-flight adapter check (`gpu::probe_native`). The same wgpu as Bevy's (one copy in the
# lock file), so its backend features unify with the ones Bevy enables.
wgpu = { version = "30.0.2", default-features = false }

# Process memory and the OS version for the scrub bench (already in the tree via winit/wgpu).
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", features = ["webgpu"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
# Already in the tree via wasm-bindgen; for Date.now, Math.random and the Blob parts array.
js-sys = "0.3"
# Awaits `navigator.gpu.requestAdapter()` before the app starts (already in the tree via wgpu).
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Storage",
    # `?scrub-bench` and the other launch flags come from the page URL.
    "Location",
    # The scrub bench reports the browser's user agent.
    "Navigator",
    # The web scrub bench measures cold load from navigation (`performance.now()`).
    "Performance",
    "Blob",
    "BlobPropertyBag",
    "Url",
    # Needed for append_child/set_text_content and the pagehide listener.
    "Node",
    "EventTarget",
] }

[dev-dependencies]
# Writes a deliberately broken `.tfplates` in the data-loading failure tests.
ruzstd = "0.9"
# Edits f16 frame texels in the globe fixture test (already a timefly_core dependency).
half = "2"
