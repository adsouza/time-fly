<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Fly</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #101c28; color: #fff; }
    body { font: 1rem system-ui, sans-serif; }
    canvas {
      display: block;
      /* Override the engine's inline pixel size so the timeline stays inside the viewport. */
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #startup { padding: 1.5rem; margin: 0; }
  </style>
</head>
<body>
  <p id="startup" role="status">Loading Time Fly…</p>
  <script type="module">
    const status = document.getElementById("startup");
    try {
      const { default: init } = await import("./timefly.js");
      await init();
      status.remove();
    } catch (error) {
      status.textContent = "Time Fly could not start. Reload the page to try again.";
      console.error(error);
    }
  </script>
</body>
</html>
